name: Pipeline

on:
  push:
  workflow_dispatch: 

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: "Determine version"
        id: ver
        env:
          RUN_VERSION: ${{ github.run_number }}
        run: |
          echo "version=1.0.$RUN_VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION=1.0.$RUN_VERSION" >> "$GITHUB_ENV"
      - name: "Print version"
        run: |
          echo "Printing version from output ${{ steps.ver.outputs.version }}"
          echo "Printing version from env $VERSION"
