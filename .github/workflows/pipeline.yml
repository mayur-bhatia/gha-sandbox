name: Pipeline

on:
  push:
  workflow_dispatch: 

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: "Determine version"
        id: ver
        env:
          RUN_VERSION: ${{ github.run_number }}
        run: |
          echo "version=1.0.$RUN_VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION=1.0.$RUN_VERSION" >> "$GITHUB_ENV"
      - name: "Print version"
        run: |
          echo "Printing version from output ${{ steps.ver.outputs.version }}"
          echo "Printing version from bash env $VERSION"
          echo "This file contains version" > /tmp/version.txt
          echo "VERSION=$VERSION" >> /tmp/version.txt
      - name: Upload version file
        uses: actions/upload-artifact@v4
        with:
          name: version-file
          path: /tmp/version.txt
    outputs:
      version_from_step: ${{ steps.ver.outputs.version }}


  report:
    name: Report
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download version file
        uses: actions/download-artifact@v4
        with:
          name: version-file
      - name: Log built version
        run: |
          echo "Version from version_from_step: ${{ needs.build.outputs.version_from_step }}"
          cat version.txt