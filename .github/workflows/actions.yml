name: GHA Demo

on:
  push:
  workflow_dispatch: 

jobs:
  print:
    name: Print
    runs-on: ubuntu-latest
    steps:
      - name: "Say hello"
        run: echo "Hello from ${{  github.ref_name }} at ${{  github.sha }}"

      - name: Dump GH Context

        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
      
        run: |
          echo "JSON:"
          echo "$GITHUB_CONTEXT"
