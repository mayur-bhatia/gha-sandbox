name: GHA Demo

on:
  push:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to run"
        default: qa
        type: choice
        options:
          - prod
          - qa
      dry_run:
        description: Dry run?
        default: true
        type: boolean


jobs:
  print:
    name: Print
    runs-on: ubuntu-latest
    steps:
      - name: "Say hello"
        run: echo "Hello from ${{  github.ref_name }} at ${{  github.sha }}"

      - name: Dump GH Context

        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
      
        run: |
          echo "JSON:"
          echo "$GITHUB_CONTEXT"
      
      - name: Log the env and dry run
        run: |
          echo "Deployong to ${{ inputs.environment }} (dry run: ${{ inputs.dry_run }})"
