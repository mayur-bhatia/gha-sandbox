name: Conditions

on:
  workflow_dispatch: 
    inputs:
      should_fail:
        type: boolean
        default: true

jobs:
  ci:
    runs-on: ubuntu-latest
    name: ci
    steps:
      - name: Lint
        continue-on-error: true
        run: |
          echo "Always fail"
          exit 1

      - name: Test
        if: ${{ inputs.should_fail }}
        run: |
          exit 1

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: report.txt


      - name: Alert
        if: ${{ failure() }}
        run: |
          echo "ALERT: tests failed"

      - name: Cleanup
        if: ${{ always() }}
        run: |
          echo "Cleaning up"


