name: Conditions

on:
  workflow_dispatch: 
    inputs:
      should_fail:
        type: boolean
        default: false

jobs:
  ci:
    runs-on: ubuntu-latest
    name: ci
    steps:
      - name: Lint
        continue-on-error: true
        run: |
          echo "Always fail"
          exit 1

      - name: Test
        env:
          SHOULD_FAIL: ${{ inputs.should_fail }}
        run: |
          if [ "$SHOULD_FAIL" == "true" ]; then
            exit 1
          fi
      
      - name: prepare report
        run: |
          echo "The test results are here" > report.txt

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: report.txt


      - name: Alert
        if: ${{ failure() }}
        run: |
          echo "ALERT: tests failed"

      - name: Cleanup
        if: ${{ always() }}
        run: |
          echo "Cleaning up"